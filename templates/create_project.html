{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="card bg-[#111827] border border-slate-800 rounded-3xl p-8">

        <div class="mb-8">

            <h1 class="text-5xl font-bold text-white">
                Create Project
            </h1>

            <p class="text-gray-400 mt-3">
                Start building something amazing with developers around the world.
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="space-y-6">

                {{ form.as_p }}

            </div>

            <div class="flex gap-4 mt-8">

                <button
                    type="submit"
                    class="bg-purple-600 hover:bg-purple-700 transition px-8 py-3 rounded-xl font-semibold">

                    Create Project

                </button>

                <a
                    href="/projects/"
                    class="bg-slate-800 border border-slate-700 hover:border-purple-500 transition px-8 py-3 rounded-xl font-semibold">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
