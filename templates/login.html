
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DevConnect</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#020817] min-h-screen flex justify-center items-center p-6">

    <div class="w-full max-w-md">

        <div class="bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-xl">

            <!-- Logo / Heading -->
            <div class="text-center mb-8">

                <h1 class="text-5xl font-bold text-white">
                    DevConnect
                </h1>

                <p class="text-gray-400 mt-3">
                    Connect. Collaborate. Build.
                </p>

            </div>

            <!-- Login Form -->
            <form method="POST" action="">

                {% csrf_token %}

                <!-- Error / Success Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-5 p-3 rounded-xl text-sm
                            {% if message.tags == 'error' %}
                                bg-red-500/10 border border-red-500 text-red-400
                            {% else %}
                                bg-green-500/10 border border-green-500 text-green-400
                            {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="space-y-5">

                    <!-- Username -->
                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            placeholder="Enter username"
                            required
                            autocomplete="username"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">

                    </div>

                    <!-- Password -->
                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter password"
                            required
                            autocomplete="current-password"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">

                    </div>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full mt-8 bg-purple-600 hover:bg-purple-700 text-white transition py-4 rounded-xl font-semibold">

                    Login

                </button>

            </form>

            <!-- Forgot Password -->
            <div class="text-center mt-5">

                <a
                    href="/forgot-password/"
                    class="text-purple-400 hover:text-purple-300 transition">

                    Forgot Password?

                </a>

            </div>

            <!-- Register -->
            <div class="text-center mt-8 pt-6 border-t border-slate-800">

                <p class="text-gray-400">
                    Don't have an account?
                </p>

                <a
                    href="/register/"
                    class="text-purple-400 hover:text-purple-300 font-semibold transition">

                    Create Account

                </a>

            </div>

        </div>

    </div>

</body>
</html>
