<!DOCTYPE html>
<html>
<head>

    <title>Reset Password | DevConnect</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-[#020817] min-h-screen flex justify-center items-center p-6">

    <div class="w-full max-w-md">

        <div class="bg-[#111827] border border-slate-800 rounded-3xl p-8">

            <div class="text-center mb-8">

                <h1 class="text-4xl font-bold text-white">
                    Reset Password
                </h1>

                <p class="text-gray-400 mt-3">
                    Enter your username and create a new password.
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="space-y-6">

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            Username
                        </label>

                        {{ form.username }}

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            New Password
                        </label>

                        {{ form.new_password }}

                    </div>

                </div>

                <button
                    type="submit"
                    class="w-full mt-8 bg-purple-600 hover:bg-purple-700 transition py-4 rounded-xl font-semibold">

                    Reset Password

                </button>

            </form>

            <a
                href="/login/"
                class="block text-center mt-6 text-gray-400 hover:text-white transition">

                Back to Login

            </a>

        </div>

    </div>

</body>
</html>
