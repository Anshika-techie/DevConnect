{% extends 'base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="bg-[#111827] p-8 rounded-3xl border border-slate-800">

        <h1 class="text-3xl font-bold mb-6">

            Reply Message

        </h1>

        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-5">

            <p class="text-yellow-400 text-sm">

                Replying to {{ original.user.username }}

            </p>

            <p class="mt-2">

                {{ original.message }}

            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <textarea
                name="message"
                rows="4"
                placeholder="Type your reply..."
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4"></textarea>

            <button
                type="submit"
                class="mt-5 bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-xl">

                Send Reply

            </button>

        </form>

    </div>

</div>

{% endblock %}
