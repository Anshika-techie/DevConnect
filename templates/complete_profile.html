<!DOCTYPE html>
<html>
<head>

    <title>Complete Profile | DevConnect</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-[#020817] min-h-screen flex justify-center items-center p-6">

    <div class="w-full max-w-3xl">

        <div class="bg-[#111827] border border-slate-800 rounded-3xl p-10 shadow-xl">

            <div class="mb-8">

                <h1 class="text-5xl font-bold text-white mb-3">
                    Complete Your Profile
                </h1>

                <p class="text-gray-400 text-lg">
                    Help other developers know more about you and improve collaboration opportunities.
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="space-y-6">

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            Bio
                        </label>

                        {{ form.bio }}

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            College
                        </label>

                        {{ form.college }}

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            GitHub Profile
                        </label>

                        {{ form.github_link }}

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            LinkedIn Profile
                        </label>

                        {{ form.linkedin_link }}

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            Skills
                        </label>

                        {{ form.skills }}

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-300 mb-2">
                            Experience Level
                        </label>

                        {{ form.experience_level }}

                    </div>

                </div>

                <button
                    type="submit"
                    class="w-full mt-8 bg-purple-600 hover:bg-purple-700 transition py-4 rounded-xl font-semibold text-lg">

                    Save Profile

                </button>

            </form>

            <a
                href="/skip-profile/"
                class="block text-center mt-5 text-gray-400 hover:text-white transition">

                Skip For Now

            </a>

        </div>

    </div>

</body>
</html>
